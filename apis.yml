name: The Naked Market
description: 'The Naked Market is a San Francisco-based consumer packaged goods (CPG) company and
  brand incubator founded in 2019 by Harrison Fugman, Alex Kost, and Tim Marbach. It uses a "fast fail"
  end-to-end infrastructure to take a food or beverage product from idea to market in roughly three
  months, launching and acquiring socially conscious direct-to-consumer brands across snacks, drinks,
  and better-for-you categories. Its portfolio has included Project Breakfast, Flock crispy chicken
  chips, Avocrazy avocado puffs, Beach House Bowls, Rob''s Backstage Popcorn, and the low-alcohol
  aperitif brand Haus. The company raised $27.5 million in Series A funding in 2021 and is backed by
  HV Capital. It operates as a consumer brand holding company and does not publish a traditional
  developer API program, but its Shopify-hosted storefront exposes an agent-commerce surface:
  llms.txt agent instructions, a Universal Commerce Protocol (UCP) merchant profile, OpenID Connect
  discovery, and a live MCP endpoint for catalog search, cart, and buyer-approved checkout.'
